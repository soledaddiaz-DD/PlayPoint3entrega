# nginx: sirve la web (archivos estáticos) y le pasa /api y /uploads a Node.
# Se copia a /etc/nginx/conf.d/playpoint.conf
# Cambiá "server_name" por tu dominio (o por la IP del servidor si todavía no tenés dominio).
# Con el dominio, "certbot --nginx" agrega solo la parte de HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name TU_DOMINIO_O_IP;

    root /var/www/playpoint;
    index index.html;

    # Las fotos de perfil pesan hasta 2 MB: sin esto nginx rechaza con "413" (el valor por defecto es 1 MB)
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API y fotos: las atiende Node (solo escucha en 127.0.0.1:3000) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- La web (React): archivos con nombre único, se pueden cachear un mes ---
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # --- Cualquier otra ruta (/home, /perfil, /torneos/1...) entrega index.html y React decide qué mostrar ---
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
